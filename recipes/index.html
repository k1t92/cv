<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Рецепты с граммовкой, КБЖУ, пересчётом порций и списком покупок.">
  <title>Поварёшка — рецепты</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥘%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main id="app"><p class="boot" id="boot">Загрузка…</p></main>
  <nav id="tabs" class="tabs" aria-label="Разделы"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // Если что-то сломалось — покажем ошибку вместо пустой страницы.
    window.onerror = function (msg, src, line) {
      var b = document.getElementById("boot");
      if (!b) return;
      b.innerHTML = "Не удалось запустить сайт. Обновите страницу.<br><small>" +
        String(msg).replace(/</g, "&lt;") + " — " + String(src).split("/").pop() + ":" + line + "</small>";
    };
  </script>
  <script src="data/ingredients.js?v=2"></script>
  <script src="data/images.js?v=2"></script>
  <script src="data/credits.js?v=2"></script>
  <script src="data/chicken.js?v=2"></script>
  <script src="data/pork.js?v=2"></script>
  <script src="data/beef.js?v=2"></script>
  <script src="data/seafood.js?v=2"></script>
  <script src="data/other.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
