<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
<title>Разбор партий</title>
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#ebe9e3; --text:#1d1c1a; --muted:#77736b; --line:#e2dfd7;
  --accent:#3b6fd8; --on-accent:#fff;
  --sq-l:#eedcbc; --sq-d:#b48a64;
  --hl-last:rgba(255,212,30,.42); --hl-sel:rgba(59,111,216,.42); --best:#2b6cff; --arrow:rgba(43,108,255,.8); --dot:rgba(0,0,0,.2);
  --inacc:#c99400; --mist:#e07020; --blun:#d6343c; --miss:#9640cc; --good:#2b9a58;
  --graph-bg:#3a3733; --graph-fg:#f2f0ea;
  --ease:cubic-bezier(.2,.75,.25,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --surface:#211f1c; --surface-2:#2c2a26; --text:#ebe8e2; --muted:#9a958c; --line:#34312c;
    --accent:#7ba2ff; --on-accent:#0e1424;
    --sq-l:#d3bf9c; --sq-d:#8f6c4d; --dot:rgba(0,0,0,.28);
    --inacc:#e8b923; --mist:#ff9045; --blun:#ff5b61; --miss:#c27bff; --good:#4cc47e;
    --graph-bg:#2b2926; --graph-fg:#e7e3db;
  }
}
:root[data-theme="dark"]{
  --bg:#161512; --surface:#211f1c; --surface-2:#2c2a26; --text:#ebe8e2; --muted:#9a958c; --line:#34312c;
  --accent:#7ba2ff; --on-accent:#0e1424;
  --sq-l:#d3bf9c; --sq-d:#8f6c4d; --dot:rgba(0,0,0,.28);
  --inacc:#e8b923; --mist:#ff9045; --blun:#ff5b61; --miss:#c27bff; --good:#4cc47e;
  --graph-bg:#2b2926; --graph-fg:#e7e3db;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;transition:background-color .25s,color .25s}
.view{max-width:560px;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.view.enter{animation:viewIn .32s var(--ease)}
.view.enter-back{animation:viewBack .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateX(18px)}}
@keyframes viewBack{from{opacity:0;transform:translateX(-18px)}}

button{font:inherit;color:inherit;background:var(--surface-2);border:0;border-radius:12px;padding:10px 14px;cursor:pointer;touch-action:manipulation;transition:transform .12s var(--ease),background-color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
button.ghost{background:transparent}
button.icon{display:inline-grid;place-items:center;width:42px;height:42px;padding:0}
button svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.bar{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;min-height:58px}
.bar h1{font-size:22px;font-weight:700;margin:0 0 0 4px;flex:1;letter-spacing:-.01em}
.title{flex:1;min-width:0;line-height:1.25}
.title b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{color:var(--muted);font-size:13px}

.nickRow{display:flex;gap:6px;padding:0 16px 4px}
#nick{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--surface);border:1px solid transparent;border-radius:12px;padding:10px 12px;transition:border-color .2s}
#nick:focus{outline:none;border-color:var(--accent)}
.msg{color:var(--muted);font-size:13px;padding:6px 16px 0;min-height:0}
.msg:empty{display:none}
.msg.err{color:var(--blun)}

.games{list-style:none;margin:6px 12px 0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.games:empty{display:none}
.games li+li{border-top:1px solid var(--line)}
.games button{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border-radius:0;padding:12px 14px}
.games button:active{transform:none;background:var(--surface-2)}
.gres{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px}
.gres.w{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.gres.l{background:color-mix(in srgb,var(--blun) 16%,transparent);color:var(--blun)}
.gres.d{background:var(--surface-2);color:var(--muted)}
.gmain{min-width:0}
.gmain b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmain span{color:var(--muted);font-size:13px}
.gside{color:var(--muted);font-size:12px;text-align:right}
.gside .done{display:block;width:7px;height:7px;border-radius:50%;background:var(--good);margin:0 0 0 auto}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px var(--muted) inset;margin-right:6px;vertical-align:0}
.cdot.w{background:#fff} .cdot.b{background:#2a2a2a;box-shadow:none}
.wide{display:block;width:calc(100% - 24px);margin:10px 12px 0}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:22px 16px 8px}

.manual{margin:18px 12px 0;background:var(--surface);border-radius:16px;padding:0 14px}
.manual summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:500}
.manual summary::-webkit-details-marker{display:none}
.manual[open]{padding-bottom:14px}
textarea{width:100%;min-height:120px;resize:vertical;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.settings{display:flex;align-items:center;justify-content:space-between;margin:12px 12px 0;padding:8px 8px 8px 14px;background:var(--surface);border-radius:16px;color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:2px;position:relative}
.seg button{background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;transition:background-color .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
#goBtn{width:100%}

.progress{padding:0 16px 8px;font-size:12.5px;color:var(--muted)}
.progress[hidden]{display:none}
.pbar{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-bottom:5px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s var(--ease)}
.progress.err{color:var(--blun)}

.banner{margin:0 12px 10px;padding:12px 14px;border-radius:16px;background:var(--surface);animation:fadeUp .25s var(--ease)}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner .sub{color:var(--muted);font-size:13.5px}
.ok{color:var(--good);font-weight:600} .bad{color:var(--blun);font-weight:600}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}

.evalbar{height:6px;background:#2a2826;position:relative;overflow:hidden}
.evalbar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:#f3f1ea;transition:width .45s var(--ease)}
.boardWrap{position:relative;width:100%;aspect-ratio:1/1;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
.boardWrap svg.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#board .l{fill:var(--sq-l)} #board .d{fill:var(--sq-d)}
#board .cl{fill:var(--sq-d);font:600 17px system-ui,sans-serif} #board .cd{fill:var(--sq-l);font:600 17px system-ui,sans-serif}
#board .last{fill:var(--hl-last)} #board .sel{fill:var(--hl-sel)}
#board .frame{fill:none;stroke:var(--best);stroke-width:6}
#board rect,#board circle{transition:fill .2s}
#overlay .arrow{stroke:var(--arrow);stroke-width:15;stroke-linecap:round;fill:none}
#overlay .ahead{fill:var(--arrow)}
#overlay .dot{fill:var(--dot)} #overlay .ring{fill:none;stroke:var(--dot);stroke-width:8}
#overlay g{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
#pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .24s var(--ease),opacity .2s;will-change:transform}
.pc svg{width:100%;height:100%;display:block;overflow:visible}
.pc text{font-family:"DejaVu Sans","Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","Arial Unicode MS",sans-serif;font-size:82px;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke-linejoin:round}
.pc .w{fill:#fbfbf8;stroke:#1b1b1b;stroke-width:4.5}
.pc .b{fill:#1e1e1e;stroke:#1e1e1e;stroke-width:2}
.pc.fresh,.pc.gone{opacity:0}
.pc.lift{z-index:2}
#pieces.instant .pc{transition:none}
#promo{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:8px;animation:fadeIn .15s}
#promo[hidden]{display:none}
#promo button{width:20%;aspect-ratio:1/1;padding:0;background:var(--surface);border-radius:14px}
#promo svg{width:100%;height:100%}

.strip[hidden],.actions[hidden]{display:none}
.strip{display:flex;gap:2px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 40%}
.strip::-webkit-scrollbar{display:none}
.strip .n{color:var(--muted);font-size:13px;padding:5px 2px 5px 8px;flex:none}
.strip .m{flex:none;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:14.5px;white-space:nowrap;transition:background-color .2s,color .2s}
.strip .m.cur{background:var(--accent);color:var(--on-accent)}
.strip .m.cur .a{color:inherit}

.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 12px}
.nav[hidden]{display:none}
.nav button{height:46px;display:grid;place-items:center;padding:0}

.info{margin:12px 12px 0;padding:14px;border-radius:16px;background:var(--surface);min-height:96px}
.info[hidden]{display:none}
.mvline{display:flex;align-items:baseline;gap:8px}
.mvline .mv{font-size:18px;font-weight:600}
.mvline .ev{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.info .hint{margin-top:4px}
.info .best{margin-top:10px;display:flex;align-items:baseline;gap:8px}
.info .best .ev{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.info .pv{color:var(--muted);font-size:13.5px;margin-top:2px}
.info .k{color:var(--muted)}
.a{font-weight:700}
.t-inacc{color:var(--inacc)} .t-mist{color:var(--mist)} .t-blun{color:var(--blun)} .t-miss{color:var(--miss)} .t-best{color:var(--good)}
.fade{animation:fadeIn .2s ease}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px 0}
.actions button{padding:12px 8px}

#graph{display:block;width:calc(100% - 24px);margin:0 12px;height:110px;border-radius:12px;touch-action:pan-y;cursor:pointer}
.rows{list-style:none;margin:0 12px;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.rows li{padding:11px 14px;cursor:pointer;transition:background-color .15s}
.rows li+li{border-top:1px solid var(--line)}
.rows li:active{background:var(--surface-2)}
.rows .top{display:flex;align-items:baseline;gap:8px}
.rows .top .ev{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rows .sub{color:var(--muted);font-size:13.5px}
.rows .empty{color:var(--muted);cursor:default}
.label .cnt{font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;z-index:9;opacity:0;transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabview{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);transition:transform .3s var(--ease)}
.tabs.off{transform:translateY(110%)}
.tabs button{flex:1;max-width:180px;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 4px;color:var(--muted)}
.tabs button.on{color:var(--accent)}
.cats{display:grid;gap:10px;padding:4px 12px 0}
.cat{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:14px 16px}
.cat b{display:block;font-size:16.5px;font-weight:600}
.cat span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.cbar{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--good);border-radius:2px;transition:width .5s var(--ease)}
.status{margin:0 12px 10px;padding:12px 14px;border-radius:16px;background:var(--surface);min-height:48px}
.status .big{font-size:28px;font-weight:700;letter-spacing:.02em;margin-right:6px;vertical-align:-2px}
#solveBtns{display:grid}
#board .mk-sel{fill:rgba(59,111,216,.45)} #board .mk-ok{fill:rgba(43,154,88,.55)} #board .mk-bad{fill:rgba(214,52,60,.45)}
#board .mk-miss{fill:none;stroke:#e0313a;stroke-width:7}
select{font:inherit;color:var(--text);background:var(--surface-2);border:0;border-radius:10px;padding:8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<section id="listView" class="view tabview">
  <header class="bar">
    <h1>Партии</h1>
    <button id="themeBtn" class="ghost icon" aria-label="Сменить тему"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </header>
  <div class="nickRow">
    <input id="nick" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ник на chess.com" placeholder="Ник на chess.com">
    <button id="reloadBtn" class="icon" aria-label="Обновить"><svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
  </div>
  <div id="ccMsg" class="msg"></div>
  <ul id="ccGames" class="games"></ul>
  <button id="moreBtn" class="wide" hidden>Показать ещё</button>
  <div id="recentWrap" hidden>
    <h2 class="label">Вставленные вручную</h2>
    <ul id="recent" class="games"></ul>
  </div>
  <details id="manualBox" class="manual">
    <summary>Вставить PGN</summary>
    <textarea id="pgn" spellcheck="false" placeholder="PGN партии"></textarea>
    <div class="row"><span class="k">Я играл</span>
      <div class="seg" id="colorSeg"><button data-v="auto" class="on">Авто</button><button data-v="w">Белыми</button><button data-v="b">Чёрными</button></div>
    </div>
    <button id="goBtn" class="primary">Разобрать</button>
  </details>
  <div class="settings"><span>Глубина анализа</span>
    <div class="seg" id="depthSeg"><button data-v="16" class="on">16</button><button data-v="17">17</button><button data-v="18">18</button></div>
  </div>
  <div id="inputMsg" class="msg"></div>
</section>

<section id="gameView" class="view" hidden>
  <header class="bar">
    <button id="backBtn" class="ghost icon" aria-label="К списку партий"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="gameTitle" class="title"></div>
    <button id="flipBtn" class="ghost icon" aria-label="Перевернуть доску"><svg class="ico" viewBox="0 0 24 24"><path d="M7 20V4M4 7l3-3 3 3M17 4v16M14 17l3 3 3-3"/></svg></button>
  </header>
  <div id="progress" class="progress"><div class="pbar"><i id="progBar"></i></div><span id="progText"></span></div>
  <div id="banner" class="banner" hidden></div>
  <div class="evalbar"><i id="evalFill"></i></div>
  <div id="gameSlot"><div id="boardWrap" class="boardWrap" aria-label="Шахматная доска">
    <svg id="board" class="layer" viewBox="0 0 800 800"></svg>
    <div id="pieces"></div>
    <svg id="overlay" class="layer" viewBox="0 0 800 800"></svg>
    <div id="promo" hidden></div>
  </div></div>
  <div id="moves" class="strip"></div>
  <div id="nav" class="nav">
    <button id="firstBtn" aria-label="В начало"><svg class="ico" viewBox="0 0 24 24"><path d="M17 6l-6 6 6 6M7 6v12"/></svg></button>
    <button id="prevBtn" aria-label="Назад"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="nextBtn" aria-label="Вперёд"><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="lastBtn" aria-label="В конец"><svg class="ico" viewBox="0 0 24 24"><path d="M7 6l6 6-6 6M17 6v12"/></svg></button>
    <button id="hintBtn" aria-label="Показать лучший ход"><svg class="ico" viewBox="0 0 24 24"><path d="M5 19L19 5M11 5h8v8"/></svg></button>
  </div>
  <div id="info" class="info"></div>
  <div id="actionsBox" class="actions">
    <button id="puzzleBtn">Найди ход сам</button>
    <button id="playBtn">Играть отсюда</button>
  </div>
  <h2 class="label">Оценка</h2>
  <svg id="graph" viewBox="0 0 600 110" preserveAspectRatio="none"></svg>
  <h2 class="label">Ваши ошибки <span id="summary" class="cnt"></span></h2>
  <ul id="missed" class="rows"></ul>
  <div id="notTakenSec">
    <h2 class="label">Соперник не взял</h2>
    <ul id="notTaken" class="rows"></ul>
  </div>
</section>
<section id="tasksView" class="view tabview" hidden>
  <header class="bar"><h1>Задачи</h1></header>
  <div id="tasksMsg" class="msg"></div>
  <div id="taskCats" class="cats"></div>
</section>

<section id="trainView" class="view tabview" hidden>
  <header class="bar"><h1>Тренировка</h1></header>
  <div id="trainCats" class="cats"></div>
</section>

<section id="solveView" class="view" hidden>
  <header class="bar">
    <button id="solveBack" class="ghost icon" aria-label="Назад"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="solveTitle" class="title"></div>
    <button id="solveFlip" class="ghost icon" aria-label="Перевернуть доску"><svg class="ico" viewBox="0 0 24 24"><path d="M7 20V4M4 7l3-3 3 3M17 4v16M14 17l3 3 3-3"/></svg></button>
  </header>
  <div id="solveStatus" class="status"></div>
  <div id="solveSlot"></div>
  <div id="solveBtns" class="actions"></div>
</section>

<nav id="tabs" class="tabs">
  <button data-tab="list" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Партии</button>
  <button data-tab="tasks"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Задачи</button>
  <button data-tab="train"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Тренировка</button>
</nav>
<div id="toast" class="toast" role="status"></div>

<script>
// Если модуль не загрузился (нет интернета при первом открытии) — сказать об этом, а не молчать.
setTimeout(function(){
  if (!window.__appReady) {
    var m = document.getElementById('inputMsg');
    m.className = 'msg err';
    m.textContent = 'Не удалось загрузить chess.js. Нужен интернет хотя бы при первом открытии.';
  }
}, 8000);
</script>
<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js';

const DEFAULT_NICK = 'k1t92';
const CC_CACHE = 'pgnReview.ccGames.v1';
const SF = 'https://cdn.jsdelivr.net/npm/stockfish@18.0.8/bin/stockfish-18-lite-single';
const LOCAL_SF = 'stockfish/stockfish-18-lite-single';
const STORE_KEY = 'pgnReview.games.v1';
const THEME_KEY = 'pgnReview.theme';
const PREF_KEY = 'pgnReview.prefs';
const MAX_SAVED = 20;
const PV_PLIES = 6;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- Stockfish в Web Worker
// Сначала копия рядом с сайтом (тот же адрес — так работает Safari на iPhone),
// если её нет (файл открыт с диска) — с CDN через blob-воркер. Путь к .wasm сборка Stockfish берёт из #hash.
function engineSources() {
  const list = [];
  if (location.protocol.startsWith('http')) {
    list.push(() => new Worker(LOCAL_SF + '.js#' + encodeURIComponent(new URL(LOCAL_SF + '.wasm', location.href).href)));
  }
  list.push(() => {
    const blob = new Blob([`importScripts(${JSON.stringify(SF + '.js')});`], { type: 'application/javascript' });
    return new Worker(URL.createObjectURL(blob) + '#' + encodeURIComponent(SF + '.wasm'));
  });
  return list;
}
function startWorker(make, options, onLine) {
  return new Promise((resolve, reject) => {
    let w;
    try { w = make(); } catch (e) { reject(e); return; }
    let stage = 0;
    const fail = msg => { clearTimeout(timer); w.terminate(); reject(new Error(msg)); };
    const timer = setTimeout(() => fail('движок не ответил за 60 секунд'), 60000);
    w.onerror = e => { e.preventDefault?.(); fail(e.message || 'ошибка воркера'); };
    w.onmessage = e => {
      const line = String(e.data);
      if (stage === 0 && line === 'uciok') {
        stage = 1;
        for (const [k, v] of Object.entries(options)) w.postMessage(`setoption name ${k} value ${v}`);
        w.postMessage('isready');
      } else if (stage === 1 && line === 'readyok') {
        stage = 2; clearTimeout(timer); w.onerror = null; resolve(w);
      } else if (stage === 2) onLine(line);
    };
    w.postMessage('uci');
  });
}
class Engine {
  constructor(options = {}) {
    this.queue = []; this.cur = null;
    this.ready = (async () => {
      const errors = [];
      for (const make of engineSources()) {
        try { this.w = await startWorker(make, options, line => this.onLine(line)); return; }
        catch (e) { errors.push(e.message); }
      }
      throw new Error(errors.join('; '));
    })();
    this.ready.catch(() => { for (const j of this.queue) j.resolve(null); this.queue = []; });
  }
  send(cmd) { this.w.postMessage(cmd); }
  // go: например 'depth 16' или 'movetime 800'. Возвращает {type, n, pv, best, depth} с точки зрения стороны, которая ходит.
  analyse(fen, go, { priority = false } = {}) {
    return new Promise(resolve => {
      const job = { fen, go, resolve, info: null };
      if (priority) this.queue.unshift(job); else this.queue.push(job);
      this.pump();
    });
  }
  pump() {
    this.ready.then(() => {
      if (this.cur || !this.queue.length) return;
      const job = this.cur = this.queue.shift();
      this.send('position fen ' + job.fen);
      this.send('go ' + job.go);
    }, () => {});
  }
  onLine(line) {
    const job = this.cur;
    if (!job) return;
    if (line.startsWith('info ') && line.includes(' pv ') && !line.includes('bound')) {
      const mp = / multipv (\d+)/.exec(line);
      if (mp && mp[1] !== '1') return;
      const sc = / score (cp|mate) (-?\d+)/.exec(line);
      if (!sc) return;
      const d = / depth (\d+)/.exec(line);
      job.info = { type: sc[1], n: +sc[2], depth: d ? +d[1] : 0, pv: line.split(' pv ')[1].trim().split(/\s+/) };
    } else if (line.startsWith('bestmove')) {
      const best = line.split(/\s+/)[1];
      this.cur = null;
      job.resolve(job.info ? { ...job.info, best: best === '(none)' ? null : best, stopped: !!job.stopped } : null);
      this.pump();
    }
  }
  stopAll() {
    for (const j of this.queue) j.resolve(null);
    this.queue = [];
    if (this.cur) { this.cur.stopped = true; this.send('stop'); }
  }
}

// ---------- оценки
// Оценка хранится с точки зрения белых в пешках; мат в N кодируется как ±(1000 − N).
function toEval(r, fen) {
  const black = fen.split(' ')[1] === 'b';
  let v, mate = null;
  if (r.type === 'mate') { mate = r.n; v = r.n > 0 ? 1000 - r.n : -1000 - r.n; }
  else v = r.n / 100;
  if (black) { v = -v; if (mate !== null) mate = -mate; }
  return { v, mate, best: r.best, pv: (r.pv || []).slice(0, PV_PLIES + 2), d: r.depth };
}
function terminalEval(fen) {
  const ch = new Chess(fen);
  if (ch.isCheckmate()) return { v: ch.turn() === 'w' ? -1000 : 1000, mate: 0, best: null, pv: [], end: 'mate' };
  if (ch.isStalemate() || ch.isInsufficientMaterial() || ch.isDraw()) return { v: 0, mate: null, best: null, pv: [], end: 'draw' };
  return null;
}
const clamp = v => Math.max(-10, Math.min(10, v));
const winChance = v => 1 / (1 + Math.exp(-0.368208 * clamp(v)));
function fmtEval(e) {
  if (!e) return '';
  if (e.mate !== null && e.mate !== undefined) return e.mate === 0 ? 'мат' : (e.mate < 0 ? '−' : '') + 'M' + Math.abs(e.mate);
  const v = Math.abs(e.v) < 0.05 ? 0 : e.v;
  return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
}
const fmtLoss = x => x.toFixed(1);

// ---------- нотация
const RU = { K: 'Кр', Q: 'Ф', R: 'Л', B: 'С', N: 'К' };
const ru = san => san.replace(/^[KQRBN]/, p => RU[p]).replace(/=([QRBN])/, (m, p) => '=' + RU[p]);
const PIECE_ACC = { p: 'пешку', n: 'коня', b: 'слона', r: 'ладью', q: 'ферзя', k: 'короля' };
function numPrefix(fen, force) {
  const [, c, , , , n] = fen.split(' ');
  return c === 'w' ? `${n}. ` : force ? `${n}… ` : '';
}
const moveLabel = (fen, san) => numPrefix(fen, true) + ru(san);
const uciObj = u => ({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] || undefined });
function tryMove(ch, u) { try { return ch.move(uciObj(u)); } catch { return null; } }
function pvLine(fen, pv, max = PV_PLIES) {
  const ch = new Chess(fen); const out = [];
  for (const u of pv.slice(0, max)) {
    const f = ch.fen(); const m = tryMove(ch, u);
    if (!m) break;
    out.push(numPrefix(f, out.length === 0) + ru(m.san));
  }
  return out.join(' ');
}
function sanOf(fen, u) { const m = u && tryMove(new Chess(fen), u); return m ? m.san : null; }

// ---------- PGN
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
function parsePgn(text) {
  text = text.replace(/\r/g, '').replace(/ /g, ' ').trim();
  if (!text) throw new Error('Вставьте PGN партии.');
  const chunk = text.split(/\n\s*\n(?=\s*\[)/)[0]; // если вставлено несколько партий — берём первую
  const headers = {};
  let body = chunk.replace(/^\s*\[(\w+)\s+"((?:[^"\\]|\\.)*)"\]\s*$/gm, (m, k, v) => { headers[k] = v.replace(/\\"/g, '"'); return ''; });
  body = body.replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ');
  let prev;
  do { prev = body; body = body.replace(/\([^()]*\)/g, ' '); } while (body !== prev);
  body = body.replace(/\$\d+/g, ' ').replace(/\d+\s*\.+/g, ' ').replace(/\.+|…/g, ' ');
  let ch;
  try { ch = headers.FEN ? new Chess(headers.FEN) : new Chess(); }
  catch { throw new Error('Некорректная начальная позиция (FEN) в заголовках.'); }
  const startFen = ch.fen();
  for (const t of body.split(/\s+/).filter(Boolean)) {
    if (/^(1-0|0-1|1\/2-1\/2|½-½|\*)$/.test(t)) break;
    const san = t.replace(/[!?]+$/, '').replace(/^0-0-0/, 'O-O-O').replace(/^0-0/, 'O-O');
    try { ch.move(san); }
    catch { throw new Error(`Не получилось разобрать ход «${t}» после ${ch.history().length} полуходов.`); }
  }
  const hist = ch.history({ verbose: true });
  if (!hist.length) throw new Error('В PGN нет ходов.');
  const moves = hist.map(m => ({ san: m.san, uci: m.from + m.to + (m.promotion || ''), from: m.from, to: m.to, color: m.color, captured: m.captured || null }));
  const fens = [startFen, ...hist.map(m => m.after)];
  const id = hash([headers.White, headers.Black, headers.Date, headers.UTCTime, startFen, moves.map(m => m.uci).join(' ')].join('|'));
  return { id, headers, moves, fens };
}
function nick() { return (store.get(PREF_KEY, {}).nick || DEFAULT_NICK).trim(); }
function detectColor(h) {
  const w = (h.White || '').trim().toLowerCase(), b = (h.Black || '').trim().toLowerCase();
  const me = nick().toLowerCase();
  if (w === me) return 'w';
  if (b === me) return 'b';
  return null;
}

// ---------- классификация ходов
function derive(g) {
  const per = [], missed = [], notTaken = [];
  const counts = { inacc: 0, mistake: 0, blunder: 0, miss: 0 };
  for (let k = 0; k < g.moves.length; k++) {
    const a = g.evals[k], b = g.evals[k + 1], mv = g.moves[k];
    if (!a || !b) { per.push(null); continue; }
    const s = mv.color === 'w' ? 1 : -1;
    const before = s * a.v, after = s * b.v;
    const isBest = a.best === mv.uci;
    const loss = isBest ? 0 : Math.max(0, clamp(before) - clamp(after));
    // в уже решённых позициях (+9 → +7) потеря в пешках не значит ничего: смотрим, изменились ли шансы
    const wcDrop = isBest ? 0 : winChance(before) - winChance(after);
    let cls = null;
    if (!isBest && a.mate !== null && s * a.mate > 0 && s * a.mate <= 5 && after < 500) cls = 'miss';
    else if (wcDrop >= 0.03) cls = loss >= 3 ? 'blunder' : loss >= 1.5 ? 'mistake' : loss >= 0.5 ? 'inacc' : null;
    per.push({ loss, cls, isBest });
    if (mv.color === g.my) {
      if (cls) { counts[cls]++; missed.push(k); }
    } else if (a.best && !isBest && loss >= 1) {
      // соперник мог взять мою фигуру (лучший ход — взятие), но сыграл другое
      const m = tryMove(new Chess(g.fens[k]), a.best);
      if (m && m.captured) notTaken.push({ k, san: m.san, piece: m.captured, sq: m.to, loss });
    }
  }
  return { per, missed, notTaken, counts };
}

// ---------- сохранение
function compactEval(e) { return e ? [Math.round(e.v * 100) / 100, e.mate, e.best, e.pv.join(' '), e.end || 0] : 0; }
function expandEval(a) { return a ? { v: a[0], mate: a[1], best: a[2], pv: a[3] ? a[3].split(' ') : [], end: a[4] || undefined } : null; }
function saveGame(g) {
  let list = store.get(STORE_KEY, []).filter(x => x.id !== g.id);
  list.unshift({ id: g.id, src: g.src, t: Date.now(), pgn: g.pgn, my: g.my, colorPref: g.colorPref, depth: g.depth, h: pickHeaders(g.headers), ev: g.evals.map(compactEval) });
  list = list.slice(0, MAX_SAVED);
  while (list.length && !store.set(STORE_KEY, list)) list.pop(); // переполнение — выкидываем самые старые
}
function pickHeaders(h) {
  const o = {};
  for (const k of ['White', 'Black', 'Result', 'Date', 'WhiteElo', 'BlackElo', 'TimeControl']) if (h[k]) o[k] = h[k];
  return o;
}
function resultFor(result, my) {
  if (result === '1-0') return my === 'w' ? 'w' : 'l';
  if (result === '0-1') return my === 'b' ? 'w' : 'l';

}

}

// ---------- открыть и разобрать партию
function openGame(pgnText, { saved = null, src = null } = {}) {
  const msg = $('inputMsg'); msg.className = 'msg'; msg.textContent = '';
  let parsed;
  try { parsed = parsePgn(pgnText); }
  catch (e) { msg.className = 'msg err'; msg.textContent = e.message; return; }

  if (!(S.g && S.g.id === parsed.id)) {
    exitMode();
    stopAnalysis();
    const colorPref = saved ? (saved.colorPref || saved.my) : src ? 'auto' : prefs.color;
    const detected = detectColor(parsed.headers);
    const my = colorPref === 'auto' ? (detected || 'w') : colorPref;
    if (colorPref === 'auto' && !detected) toast(`Ника ${nick()} нет в партии — считаю, что вы белые`);
    const depth = saved ? saved.depth : prefs.depth;
    const g = { ...parsed, src: src || (saved && saved.src) || null, pgn: pgnText.trim(), my, colorPref, depth, evals: new Array(parsed.fens.length).fill(null) };
    // если партия уже разбиралась на такой же или большей глубине — берём сохранённые оценки
    const prevSaved = saved || store.get(STORE_KEY, []).find(x => x.id === g.id);
    if (prevSaved && prevSaved.ev.length === g.evals.length && prevSaved.depth >= depth) {
      g.evals = prevSaved.ev.map(expandEval); g.depth = prevSaved.depth;
    }
    S.g = g; S.ply = 0; S.orient = my; S.sel = null;
    resetPieces();
    renderTitle();
    saveGame(g);
    runAnalysis(g);
  }
  history.pushState({ game: 1 }, '');
  showView('game');
  mountBoard('gameSlot');
  refresh(true);
}

function stopAnalysis() {

let wakeLock = null;
async function requestWakeLock() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; } }
function releaseWakeLock() { try { wakeLock?.release(); } catch {} wakeLock = null; }

async function runAnalysis(g) {
  const token = ++S.anToken;
  const total = g.fens.length;
  if (g.evals.every(Boolean)) { S.analysing = false; renderProgress(); return; }
  S.analysing = true;
  S.anStart = performance.now(); S.anDoneAtStart = g.evals.filter(Boolean).length;
  renderProgress('Загрузка движка…');
  const eng = getEngine();
  try { await eng.ready; }
  catch (e) {
    if (token !== S.anToken) return;
    S.analysing = false; engine = null;
    renderProgress('Движок не запустился: ' + e.message, true);
    return;
  }
  if (token !== S.anToken) return;
  requestWakeLock();
  eng.send('ucinewgame');
  let sinceSave = 0;
  for (let k = 0; k < total; k++) {
    if (g.evals[k]) continue;
    const fen = g.fens[k];
    let e = terminalEval(fen);
    if (!e) {
      const r = await eng.analyse(fen, 'depth ' + g.depth);
      if (token !== S.anToken) return;
      if (!r || r.stopped) continue;
      e = toEval(r, fen);
    }
    g.evals[k] = e;
    if (++sinceSave >= 8) { saveGame(g); sinceSave = 0; }
    scheduleRefresh();
  }
  if (token !== S.anToken) return;
  S.analysing = false;
  releaseWakeLock();
  saveGame(g);
  refresh();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.analysing) requestWakeLock(); });

function renderProgress(text, isErr) {
  const g = S.g; if (!g) return;
  const done = g.evals.filter(Boolean).length, total = g.evals.length;
  const box = $('progress');
  box.classList.toggle('err', !!isErr);
  $('progBar').style.width = (done / total * 100).toFixed(1) + '%';
  if (text) { $('progText').textContent = text; box.hidden = false; return; }
  if (done === total) { box.hidden = true; return; }
  box.hidden = false;
  let eta = '';
  const newDone = done - (S.anDoneAtStart || 0);
  if (S.analysing && newDone >= 3) {
    const sec = Math.round((performance.now() - S.anStart) / newDone * (total - done) / 1000);
    eta = sec >= 60 ? ` · ещё ~${Math.round(sec / 60)} мин` : ` · ещё ~${sec} с`;
  }
  $('progText').textContent = `Анализ ${done} из ${total}${eta}`;
}

let refreshQueued = false;
function scheduleRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => { refreshQueued = false; refresh(); });
}
function refresh(plyChanged) {
  if (!S.g) return;
  S.derived = derive(S.g);
  renderProgress();
  drawBoard();
  renderEvalBar();
  renderNav();
  renderInfo(plyChanged);
  renderGraph();
  renderMissed();
  renderMoves(plyChanged);
  renderActions();
}

// ---------- доска: клетки и подсветка (SVG), фигуры (HTML, анимируются), стрелки и точки (SVG поверх)
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const VS = '︎'; // текстовое (не эмодзи) начертание
const pieceSvg = (type, color) => `<svg viewBox="0 0 100 100"><text x="50" y="54" class="${color}">${GLYPH[type]}${VS}</text></svg>`;
function sqXY(sq) {
  const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1;
  return S.orient === 'w' ? [f * 100, (7 - r) * 100] : [(7 - f) * 100, r * 100];
}
function xyToSq(x, y) {
  let f = Math.floor(x / 100), r = Math.floor(y / 100);
  if (f < 0 || f > 7 || r < 0 || r > 7) return null;
  if (S.orient === 'w') r = 7 - r; else f = 7 - f;
  return String.fromCharCode(97 + f) + (r + 1);
}
function boardView() {
  if (S.screen === 'solve') return solveView();
  const g = S.g;
  if (S.mode === 'puzzle') return { fen: PZ.ch.fen(), last: PZ.last, best: PZ.showBest ? g.evals[PZ.k].best : null };
  if (S.mode === 'play') return { fen: PL.ch.fen(), last: PL.last, best: null };
  const mv = g.moves[S.ply - 1];
  const e = g.evals[S.ply];
  return { fen: g.fens[S.ply], last: mv ? { from: mv.from, to: mv.to } : null, best: S.showBest && e ? e.best : null };
}
function drawBoard() {
  const v = boardView();
  const ch = v.fen ? new Chess(v.fen) : null;
  let s = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const sq = String.fromCharCode(97 + f) + (r + 1);
    const [x, y] = sqXY(sq);
    const dark = (f + r) % 2 === 0;
    s += `<rect x="${x}" y="${y}" width="100" height="100" class="${dark ? 'd' : 'l'}"/>`;
    const leftCol = S.orient === 'w' ? f === 0 : f === 7;
    const bottomRow = S.orient === 'w' ? r === 0 : r === 7;
    if (v.noCoords) continue;
    if (leftCol) s += `<text x="${x + 5}" y="${y + 20}" class="${dark ? 'cd' : 'cl'}">${r + 1}</text>`;
    if (bottomRow) s += `<text x="${x + 94}" y="${y + 94}" text-anchor="end" class="${dark ? 'cd' : 'cl'}">${String.fromCharCode(97 + f)}</text>`;
  }
  const hl = (sq, cls) => { const [x, y] = sqXY(sq); return `<rect x="${x}" y="${y}" width="100" height="100" class="${cls}"/>`; };
  if (v.last) s += hl(v.last.from, 'last') + hl(v.last.to, 'last');
  if (S.sel) s += hl(S.sel, 'sel');
  for (const mk of v.marks || []) {
    const [x, y] = sqXY(mk.sq);
    s += mk.cls === 'mk-miss' ? `<rect x="${x + 4}" y="${y + 4}" width="92" height="92" rx="8" class="mk-miss"/>` : `<rect x="${x}" y="${y}" width="100" height="100" class="${mk.cls}"/>`;
  }
  if (ch && ch.inCheck()) {
    const kingSq = findKing(ch, ch.turn());
    if (kingSq) { const [x, y] = sqXY(kingSq); s += `<circle cx="${x + 50}" cy="${y + 50}" r="46" fill="rgba(230,40,40,.5)"/>`; }
  }
  if (v.best) for (const sq of [v.best.slice(0, 2), v.best.slice(2, 4)]) {
    const [x, y] = sqXY(sq); s += `<rect x="${x + 3}" y="${y + 3}" width="94" height="94" rx="8" class="frame"/>`;
  }
  $('board').innerHTML = s;
  placePieces(ch);

  let o = '';
  if (S.sel && ch) {
    o += '<g>';
    for (const m of ch.moves({ square: S.sel, verbose: true })) {
      const [x, y] = sqXY(m.to);
      o += m.captured ? `<circle cx="${x + 50}" cy="${y + 50}" r="44" class="ring"/>` : `<circle cx="${x + 50}" cy="${y + 50}" r="14" class="dot"/>`;
    }
    o += '</g>';
  }
  if (v.best) o += `<g>${arrow(v.best.slice(0, 2), v.best.slice(2, 4))}</g>`;
  const ov = $('overlay');
  if (ov.dataset.key !== o) { ov.innerHTML = o; ov.dataset.key = o; } // не перезапускать анимацию появления без нужды
}

// Фигуры — постоянные элементы. При смене позиции каждая новая фигура ищет «себя» среди старых:
// сначала на той же клетке, потом ближайшую того же типа и цвета — и плавно переезжает.
let PIECES = [];
function resetPieces() { PIECES = []; $('pieces').innerHTML = ''; }
function placePieces(ch) {
  const box = $('pieces');
  const want = [];
  if (ch) ch.board().forEach((row, i) => row.forEach((p, j) => { if (p) want.push({ t: p.type, c: p.color, sq: String.fromCharCode(97 + j) + (8 - i) }); }));
  if (!PIECES.length) box.classList.add('instant');
  const old = PIECES, used = new Set(), next = [], rest = [];
  for (const w of want) {
    const i = old.findIndex((o, idx) => !used.has(idx) && o.t === w.t && o.c === w.c && o.sq === w.sq);
    if (i >= 0) { used.add(i); next.push(old[i]); } else rest.push(w);
  }
  const dist = (a, b) => Math.hypot(a.charCodeAt(0) - b.charCodeAt(0), a[1] - b[1]);
  for (const w of rest) {
    let bi = -1, bd = Infinity;
    old.forEach((o, idx) => { if (!used.has(idx) && o.t === w.t && o.c === w.c) { const d = dist(o.sq, w.sq); if (d < bd) { bd = d; bi = idx; } } });
    if (bi >= 0) { used.add(bi); const p = old[bi]; p.sq = w.sq; p.el.classList.add('lift'); next.push(p); }
    else {
      const el = document.createElement('div');
      el.className = 'pc fresh'; el.innerHTML = pieceSvg(w.t, w.c);
      const p = { t: w.t, c: w.c, sq: w.sq, el };
      setPos(p); box.appendChild(el); el.getBoundingClientRect();
      el.classList.remove('fresh');
      next.push(p);
    }
  }
  old.forEach((o, idx) => { if (!used.has(idx)) { o.el.classList.add('gone'); setTimeout(() => o.el.remove(), 260); } });
  for (const p of next) setPos(p);
  PIECES = next;
  if (box.classList.contains('instant')) requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove('instant')));
  setTimeout(() => { for (const p of next) p.el.classList.remove('lift'); }, 260);
}
function setPos(p) { const [x, y] = sqXY(p.sq); p.el.style.transform = `translate(${x}%, ${y}%)`; }

function arrow(from, to) {
  const [x1, y1] = sqXY(from), [x2, y2] = sqXY(to);
  const ax = x1 + 50, ay = y1 + 50, bx = x2 + 50, by = y2 + 50;
  const len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len;
  const ex = bx - ux * 30, ey = by - uy * 30;
  const hx = bx - ux * 6, hy = by - uy * 6, px = -uy * 22, py = ux * 22;
  return `<line x1="${ax + ux * 18}" y1="${ay + uy * 18}" x2="${ex}" y2="${ey}" class="arrow"/>` +
    `<polygon class="ahead" points="${hx},${hy} ${ex - ux * 6 + px},${ey - uy * 6 + py} ${ex - ux * 6 - px},${ey - uy * 6 - py}"/>`;
}
function findKing(ch, color) {
  const b = ch.board();
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { const p = b[i][j]; if (p && p.type === 'k' && p.color === color) return String.fromCharCode(97 + j) + (8 - i); }
  return null;
}
function renderEvalBar() {
  const g = S.g;
  const e = S.mode === 'puzzle' ? g.evals[PZ.k] : S.mode === 'play' ? null : g.evals[S.ply];
  if (!e) return; // держим прошлое значение, пока позиция считается
  // полоса — доля белых; при игре за чёрных переворачиваем, чтобы «ваша» сторона была слева, как на доске снизу
  const w = winChance(e.v) * 100;
  $('evalFill').style.width = (S.orient === 'w' ? w : 100 - w).toFixed(1) + '%';
  $('evalFill').style.background = S.orient === 'w' ? '#f3f1ea' : '#2a2826';
  $('evalFill').parentElement.style.background = S.orient === 'w' ? '#2a2826' : '#f3f1ea';
}

// касания: свайп листает ходы, тап выбирает поле
let down = null;
$('boardWrap').addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
$('boardWrap').addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  const start = down; down = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) {
    if (S.mode === 'view') go(S.ply + (dx < 0 ? 1 : -1));
    return;
  }
  if (Math.hypot(dx, dy) > 15) return;
  const r = $('boardWrap').getBoundingClientRect();
  const sq = xyToSq((start.x - r.left) / r.width * 800, (start.y - r.top) / r.height * 800);
  if (sq) onSquare(sq);
});
$('boardWrap').addEventListener('pointercancel', () => { down = null; });

// ---------- навигация
function go(p) {
  if (!S.g) return;
  p = Math.max(0, Math.min(S.g.fens.length - 1, p));
  if (p === S.ply) return;
  S.ply = p;
  refresh(true);
}
$('firstBtn').onclick = () => go(0);
$('prevBtn').onclick = () => go(S.ply - 1);
$('nextBtn').onclick = () => go(S.ply + 1);
$('lastBtn').onclick = () => go(S.g.fens.length - 1);
$('hintBtn').onclick = () => {
  S.showBest = !S.showBest;
  store.set(PREF_KEY, { ...store.get(PREF_KEY, {}), showBest: S.showBest });
  drawBoard(); renderNav();
};
$('flipBtn').onclick = () => { S.orient = S.orient === 'w' ? 'b' : 'w'; drawBoard(); renderEvalBar(); };
document.addEventListener('keydown', e => {
  if (S.mode !== 'view' || !S.g || $('gameView').hidden || e.target.closest('textarea,input,select')) return;
  if (e.key === 'ArrowLeft') go(S.ply - 1);
  else if (e.key === 'ArrowRight') go(S.ply + 1);
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(S.g.fens.length - 1);
});
function renderNav() {
  const n = S.g.moves.length;
  $('nav').hidden = S.mode !== 'view';
  $('prevBtn').disabled = $('firstBtn').disabled = S.ply === 0;
  $('nextBtn').disabled = $('lastBtn').disabled = S.ply === n;
  $('hintBtn').style.color = S.showBest ? 'var(--accent)' : '';
  $('hintBtn').setAttribute('aria-pressed', S.showBest);
}

// ---------- текущий ход
function renderInfo(plyChanged) {
  const box = $('info');
  if (S.mode !== 'view') { box.hidden = true; return; }
  box.hidden = false;
  const g = S.g, p = S.ply, d = S.derived;
  let h = '';
  if (p === 0) h += `<div class="mvline"><span class="mv">Начальная позиция</span></div>`;
  else {
    const k = p - 1, mv = g.moves[k], info = d.per[k], a = g.evals[k];
    h += `<div class="mvline"><span class="mv">${esc(moveLabel(g.fens[k], mv.san))}</span>${info ? ann(info.cls) : ''}<span class="ev">${fmtEval(g.evals[p])}</span></div>`;
    if (info && info.cls && a && a.best) {
      h += `<div class="hint"><span class="t-${CLS[info.cls].css}">${CLS[info.cls].name[0].toUpperCase() + CLS[info.cls].name.slice(1)}.</span> Лучше было <b>${esc(ru(sanOf(g.fens[k], a.best) || '?'))}</b>${info.cls !== 'miss' ? ` <span class="k">(−${fmtLoss(info.loss)})</span>` : ''}</div>`;
    } else if (info && info.isBest) h += `<div class="hint t-best">Лучший ход</div>`;
  }
  const e = g.evals[p];
  if (e && e.end) h += `<div class="best"><b>${e.end === 'mate' ? 'Мат' : 'Ничья'}</b></div>`;
  else if (e) {
    h += `<div class="best"><span class="k">Сильнее всего</span><b>${esc(ru(sanOf(g.fens[p], e.best) || '—'))}</b><span class="ev">${fmtEval(e)}</span></div>`;
    h += `<div class="pv">${esc(pvLine(g.fens[p], e.pv))}</div>`;
    const nx = d.per[p];
    if (nx && nx.cls && g.moves[p].color === g.my) h += `<div class="pv">В партии: ${esc(ru(g.moves[p].san))} ${ann(nx.cls)}</div>`;
  } else h += `<div class="best k">${S.analysing ? 'Считаю…' : 'Позиция не проанализирована'}</div>`;
  if (box.dataset.key !== h) {
    box.innerHTML = h; box.dataset.key = h;
    if (plyChanged) { box.classList.remove('fade'); void box.offsetWidth; box.classList.add('fade'); }
  }
}

// ---------- график
function renderGraph() {
  const g = S.g, svg = $('graph');
  const W = 600, H = 110, n = Math.max(1, g.fens.length - 1);
  const X = k => (k / n * W).toFixed(1), Y = v => (H * (1 - winChance(v))).toFixed(1);
  let s = `<rect width="${W}" height="${H}" style="fill:var(--graph-bg)"/>`;
  let last = -1;
  while (last + 1 < g.evals.length && g.evals[last + 1]) last++;
  if (last >= 0) {
    let pts = '';
    for (let k = 0; k <= last; k++) pts += `L${X(k)},${Y(g.evals[k].v)}`;
    s += `<path d="M0,${H}${pts}L${X(last)},${H}Z" style="fill:var(--graph-fg)"/>`;
  }
  s += `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="#888" stroke-opacity=".5" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  const cur = S.mode === 'view' ? S.ply : S.mode === 'puzzle' ? PZ.k : PL.ply;
  s += `<line x1="${X(cur)}" x2="${X(cur)}" y1="0" y2="${H}" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  // viewBox растянут (preserveAspectRatio="none"), поэтому точки — эллипсы, круглые на экране
  const rx = (4 * W / (svg.clientWidth || W)).toFixed(2), ry = (4 * H / (svg.clientHeight || H)).toFixed(2);
  for (const k of S.derived.missed) {
    const e = g.evals[k + 1]; if (!e) continue;
    s += `<ellipse cx="${X(k + 1)}" cy="${Y(e.v)}" rx="${rx}" ry="${ry}" style="fill:var(--${CLS[S.derived.per[k].cls].css})"/>`;
  }
  svg.innerHTML = s;
}
{
  const svg = $('graph'); let dragging = false;
  const pick = e => {
    if (!S.g || S.mode !== 'view') return;
    const r = svg.getBoundingClientRect();
    go(Math.round((e.clientX - r.left) / r.width * (S.g.fens.length - 1)));
  };
  svg.addEventListener('pointerdown', e => { dragging = true; pick(e); });
  svg.addEventListener('pointermove', e => { if (dragging && e.pointerType === 'mouse') pick(e); });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('resize', () => S.g && renderGraph());
}

// ---------- списки
function renderMissed() {
  const g = S.g, d = S.derived, c = d.counts;
  const done = g.evals.every(Boolean);
  const parts = [];
  if (c.blunder) parts.push(`${c.blunder} ${plural(c.blunder, ['зевок', 'зевка', 'зевков'])}`);
  if (c.mistake) parts.push(`${c.mistake} ${plural(c.mistake, ['ошибка', 'ошибки', 'ошибок'])}`);
  if (c.inacc) parts.push(`${c.inacc} ${plural(c.inacc, ['неточность', 'неточности', 'неточностей'])}`);
  if (c.miss) parts.push(`${c.miss} ${plural(c.miss, ['упущенный мат', 'упущенных мата', 'упущенных матов'])}`);
  $('summary').textContent = parts.length ? '· ' + parts.join(', ') : '';
  $('missed').innerHTML = d.missed.length ? d.missed.map(k => {
    const mv = g.moves[k], a = g.evals[k], b = g.evals[k + 1], cls = d.per[k].cls;
    return `<li data-k="${k}"><div class="top"><b>${esc(moveLabel(g.fens[k], mv.san))}</b>${ann(cls)}<span class="ev">${fmtEval(a)} → ${fmtEval(b)}</span></div>
      <div class="sub"><span class="t-${CLS[cls].css}">${CLS[cls].name}</span> · лучше ${esc(ru(sanOf(g.fens[k], a.best) || '?'))}</div></li>`;
  }).join('') : `<li class="empty">${done ? 'Нет' : 'Анализ идёт…'}</li>`;
  $('notTakenSec').hidden = done && !d.notTaken.length;
  $('notTaken').innerHTML = d.notTaken.length ? d.notTaken.map(x => {
    const mv = g.moves[x.k];
    return `<li data-k="${x.k}"><div class="top"><b>${esc(numPrefix(g.fens[x.k], true).trim())}</b> ${PIECE_ACC[x.piece]} на ${x.sq}<span class="ev">${esc(ru(x.san))}</span></div>
      <div class="sub">сыграл ${esc(ru(mv.san))}</div></li>`;
  }).join('') : `<li class="empty">Анализ идёт…</li>`;
}
for (const id of ['missed', 'notTaken']) $(id).addEventListener('click', e => {
  const li = e.target.closest('li[data-k]'); if (!li) return;
  exitMode();
  go(+li.dataset.k);
  $('boardWrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

// ---------- полоса ходов под доской
function renderMoves(plyChanged) {
  const g = S.g, d = S.derived, strip = $('moves');
  let s = '';
  for (let k = 0; k < g.moves.length; k++) {
    const mv = g.moves[k], info = d.per[k];
    if (mv.color === 'w' || k === 0) s += `<span class="n">${g.fens[k].split(' ')[5]}${mv.color === 'b' ? '…' : '.'}</span>`;
    s += `<span class="m${S.mode === 'view' && S.ply === k + 1 ? ' cur' : ''}" data-p="${k + 1}">${esc(ru(mv.san))}${info ? ann(info.cls) : ''}</span>`;
  }
  if (strip.dataset.key !== s) { strip.innerHTML = s; strip.dataset.key = s; }
  if (plyChanged) {
    const cur = strip.querySelector('.cur');
    const left = cur ? cur.offsetLeft - strip.clientWidth / 2 + cur.offsetWidth / 2 : 0;
    strip.scrollTo({ left, behavior: strip.dataset.ready ? 'smooth' : 'auto' });
    strip.dataset.ready = 1;
  }
}
$('moves').addEventListener('click', e => {
  const m = e.target.closest('[data-p]'); if (!m) return;
  exitMode(); go(+m.dataset.p);
});

function renderActions() {
  // в тренировке и игре прячем всё, что подсказывает или отвлекает от доски
  $('moves').hidden = $('actionsBox').hidden = S.mode !== 'view';
  const n = puzzleItems().length;
  $('puzzleBtn').disabled = !n || S.mode !== 'view';
  $('puzzleBtn').textContent = n ? `Найди ход сам · ${n}` : 'Найди ход сам';
  $('playBtn').disabled = S.mode !== 'view' || !!terminalEval(S.g.fens[S.ply]);
}

// ---------- ходы пользователя на доске (тренировка и игра)
function canUserMove() {
  if (S.mode === 'puzzle') return PZ.state === 'ask' || PZ.state === 'wrong';
  if (S.mode === 'play') return !PL.busy && !PL.ch.isGameOver() && PL.ch.turn() === PL.human;
  return false;
}
// кто сейчас принимает ходы с доски
function moveCtx() {
  if (S.screen === 'solve') {
    if (T.kind === 'puzzle' && puzzleCanMove()) return { ch: T.ch, done: puzzleMove };
    if (T.kind === 'endgame' && endgameCanMove()) return { ch: T.ch, done: endgameMove };
    return null;
  }
  if (S.mode === 'puzzle' && canUserMove()) return { ch: PZ.ch, done: onPuzzleMove };
  if (S.mode === 'play' && canUserMove()) return { ch: PL.ch, done: onPlayMove };
  return null;
}
async function onSquare(sq) {
  if (S.screen === 'solve' && (coordsTap(sq) || hangingTap(sq))) return;
  const ctx = moveCtx();
  if (!ctx) return;
  const ch = ctx.ch, piece = ch.get(sq);
  if (S.sel) {
    const cands = ch.moves({ square: S.sel, verbose: true }).filter(m => m.to === sq);
    if (cands.length) {
      let promotion;
      if (cands.some(m => m.promotion)) { promotion = await askPromotion(ch.turn()); if (!promotion) { S.sel = null; drawBoard(); return; } }
      const from = S.sel; S.sel = null;
      ctx.done(ch.move({ from, to: sq, promotion }));
      return;
    }
  }
  S.sel = piece && piece.color === ch.turn() && sq !== S.sel ? sq : null;
  drawBoard();
}
function askPromotion(color) {
  return new Promise(resolve => {
    const box = $('promo');
    box.innerHTML = ['q', 'r', 'b', 'n'].map(p => `<button data-p="${p}" class="pc" style="position:static;width:20%;height:auto;transform:none">${pieceSvg(p, color)}</button>`).join('');
    box.hidden = false;
    box.onclick = e => { const b = e.target.closest('button'); box.hidden = true; resolve(b ? b.dataset.p : null); };
  });
}
function setBanner(html) { const b = $('banner'); b.hidden = !html; b.innerHTML = html || ''; }
function exitMode() {
  if (S.mode === 'view') return;
  if (S.mode === 'play' && playEngine) playEngine.stopAll();
  S.mode = 'view'; S.sel = null;
  setBanner('');
  if (S.g) { S.orient = S.g.my; refresh(true); }
}

// ---------- «Найди ход сам»
const PZ = { items: [], i: 0, k: 0, ch: null, last: null, state: 'ask', showBest: false, text: '' };
function puzzleItems() {
  const g = S.g, d = S.derived;
  return d ? d.missed.filter(k => g.evals[k] && g.evals[k].best) : [];

function loadPuzzle(i) {

function renderPuzzle() {
  const g = S.g, k = PZ.k;

  const head = `<b>Найдите лучший ход</b> <span class="sub">${PZ.i + 1} из ${PZ.items.length} · ход ${turn}</span>`;

}
$('banner').addEventListener('click', e => {

function showPuzzleAnswer() {
  const g = S.g, k = PZ.k, e = g.evals[k];
  PZ.ch = new Chess(g.fens[k]);

  PZ.showBest = true; PZ.state = 'shown';
  PZ.text = `<b>${esc(ru(sanOf(g.fens[k], e.best) || e.best))}</b> <span class="sub">${fmtEval(e)}</span><div class="sub">${esc(pvLine(g.fens[k], e.pv))}</div><div class="sub">В партии: ${esc(ru(g.moves[k].san))}, ${fmtEval(g.evals[k + 1])}</div>`;
  renderPuzzle(); drawBoard();
}
async function onPuzzleMove(m) {
  const g = S.g, k = PZ.k, e = g.evals[k];
  const uci = m.from + m.to + (m.promotion || '');
  PZ.last = { from: m.from, to: m.to };
  drawBoard();
  const s = g.moves[k].color === 'w' ? 1 : -1;
  if (uci === e.best) {
    PZ.state = 'solved';
    PZ.text = `<span class="ok">Верно, ${esc(ru(m.san))}</span><div class="sub">${esc(pvLine(g.fens[k], e.pv))}</div>`;
    renderPuzzle(); return;
  }
  let after;
  if (uci === g.moves[k].uci) after = g.evals[k + 1];
  else {
    PZ.state = 'checking'; PZ.text = '<span class="sub">Проверяю…</span>'; renderPuzzle();
    after = terminalEval(PZ.ch.fen());
    if (!after) {
      const r = await getEngine().analyse(PZ.ch.fen(), 'depth 14', { priority: true });
      if (S.mode !== 'puzzle' || PZ.k !== k) return;
      after = r ? toEval(r, PZ.ch.fen()) : null;
    }
  }
  if (!after) { PZ.state = 'wrong'; PZ.text = 'Не удалось проверить ход.'; renderPuzzle(); return; }
  const loss = Math.max(0, clamp(s * e.v) - clamp(s * after.v));
  if (loss <= 0.3 && !(e.mate !== null && s * e.mate > 0 && s * after.v < 500)) {
    PZ.state = 'solved';
    PZ.text = `<span class="ok">Тоже хорошо, ${esc(ru(m.san))}</span><div class="sub">Движок предпочитает ${esc(ru(sanOf(g.fens[k], e.best)))}</div>`;
    renderPuzzle(); return;
  }
  PZ.state = 'wrong';
  const same = uci === g.moves[k].uci ? ', как в партии' : '';
  PZ.text = `<span class="bad">${esc(ru(m.san))}${same}: −${fmtLoss(loss)}</span> <span class="sub">Попробуйте ещё</span>`;
  renderPuzzle();
  setTimeout(() => {
    if (S.mode !== 'puzzle' || PZ.k !== k || PZ.state !== 'wrong') return;
    PZ.ch = new Chess(g.fens[k]);
    const prev = g.moves[k - 1]; PZ.last = prev ? { from: prev.from, to: prev.to } : null;
    drawBoard();
  }, 900);
}

// Ошибки из всех разобранных партий — те же позиции, что в «Найди ход сам», только собранные вместе
function mistakeItems() {
  const out = [];
  for (const sv of store.get(STORE_KEY, [])) {
    if (!sv.ev.every(Boolean)) continue;
    let parsed; try { parsed = parsePgn(sv.pgn); } catch { continue; }
    const g = { ...parsed, my: sv.my, evals: sv.ev.map(expandEval) };
    if (g.evals.length !== g.fens.length) continue;
    for (const k of derive(g).missed) {
      const e = g.evals[k]; if (!e.best) continue;
      const intro = k > 0 ? [g.moves[k - 1].uci] : [];
      out.push({ id: sv.id + ':' + k, t: 'mine', f: g.fens[k - intro.length], s: [...intro, e.best], ev: e, played: g.moves[k].san, after: g.evals[k + 1] });
    }
  }
  return out;
}

// ---------- экран решения: общий для всех тренировок
let T = { kind: null };
function clearT() { for (const t of T.timers || []) { clearTimeout(t); clearInterval(t); } if (playEngine) playEngine.stopAll(); }
function later(fn, ms) { const id = setTimeout(fn, ms); (T.timers = T.timers || []).push(id); return id; }
function enterSolve(state) {

  T = { timers: [], marks: [], last: null, ch: null, ...state };

  mountBoard('solveSlot');
}
function leaveSolve() { clearT(); T = { kind: null }; S.sel = null; showView(S.tab, true); renderTab(); }
$('solveBack').onclick = () => { if (history.state && history.state.solve) history.back(); else leaveSolve(); };
$('solveFlip').onclick = () => { S.orient = S.orient === 'w' ? 'b' : 'w'; drawBoard(); };
function renderSolve() {

  $('solveStatus').innerHTML = T.status || '';
  $('solveBtns').innerHTML = (T.btns || []).map(([a, label, primary]) => `<button data-a="${a}"${primary ? ' class="primary"' : ''}>${label}</button>`).join('');

}
$('solveBtns').addEventListener('click', e => { const a = e.target.closest('[data-a]')?.dataset.a; if (a && T.act) T.act(a); });
function solveView() { return { fen: T.ch ? T.ch.fen() : null, last: T.last, best: T.best || null, marks: T.marks, noCoords: T.noCoords }; }
const lastOf = m => m ? { from: m.from, to: m.to } : null;

// --- задачи (мат, тактика, мои ошибки)
function startPuzzles(title, items, opts = {}) {
  enterSolve({ kind: 'puzzle', title, items, i: 0, streak: 0, score: 0, marathon: !!opts.marathon, act: puzzleAct });
  loadPuzzleItem(0);
}
function puzzleTask(it) {
  if (/^m\d$/.test(it.t)) return `Мат в ${it.t[1]} хода`;
  if (it.t === 'fork') return 'Найдите вилку';
  if (it.t === 'tac') return 'Выиграйте материал';
  return 'Найдите лучший ход';
}
function loadPuzzleItem(i) {
  if (i >= T.items.length) {
    T.ch = null; T.last = null; T.best = null; T.marks = [];
    T.status = T.marathon ? `<b>Вы решили все задачи подряд: ${T.score}</b>` : '<b>Все задачи раздела пройдены</b>';
    T.btns = [['back', 'К разделам', true]];
    resetPieces(); drawBoard(); renderSolve(); return;
  }
  const it = T.items[i];
  Object.assign(T, { i, it, step: 0, failed: false, done: false, best: null, marks: [], last: null, ch: new Chess(it.f) });
  const introLen = it.t === 'mine' ? it.s.length - 1 : 1; // ход соперника, после которого задача начинается
  T.solver = introLen % 2 ? (T.ch.turn() === 'w' ? 'b' : 'w') : T.ch.turn();
  S.orient = T.solver;
  T.sub = T.marathon ? `решено подряд: ${T.score}` : `${i + 1} из ${T.items.length}`;
  T.status = `<span class="sub">Ход ${sideName(T.solver)}</span> · <b>${puzzleTask(it)}</b>`;
  T.btns = T.marathon ? [['exit', 'Закончить']] : [['hint', 'Подсказка'], ['show', 'Решение'], ['next', 'Пропустить']];
  T.state = 'intro';
  resetPieces(); drawBoard(); renderSolve();
  later(() => {
    for (let k = 0; k < introLen; k++) T.last = lastOf(tryMove(T.ch, it.s[T.step++]));
    T.state = 'ask'; drawBoard();
  }, 550);
}
function puzzleCanMove() { return T.kind === 'puzzle' && T.state === 'ask' && T.ch && T.ch.turn() === T.solver; }
async function puzzleMove(m) {
  const it = T.it, u = m.from + m.to + (m.promotion || '');
  T.last = lastOf(m); T.marks = []; T.best = null;
  drawBoard();
  const isMate = /^m\d$/.test(it.t);
  const finalStep = T.step === it.s.length - 1;
  let ok = u === it.s[T.step] || (isMate && finalStep && T.ch.isCheckmate());
  let note = '';
  if (!ok && it.t === 'mine') {
    T.state = 'checking'; T.status = '<span class="sub">Проверяю…</span>'; renderSolve();
    let after = terminalEval(T.ch.fen());
    if (!after) { const r = await getEngine().analyse(T.ch.fen(), 'depth 14', { priority: true }); after = r ? toEval(r, T.ch.fen()) : null; }
    if (T.it !== it) return;
    const s = T.solver === 'w' ? 1 : -1;
    if (after) {
      const loss = Math.max(0, clamp(s * it.ev.v) - clamp(s * after.v));
      if (loss <= 0.3) ok = true;
      else note = `−${fmtLoss(loss)}`;
    }
  }
  if (!ok) {
    T.failed = true; T.state = 'wrong';
    if (T.marathon) {
      T.state = 'over';
      saveProg(p => { p.best.marathon = Math.max(p.best.marathon || 0, T.score); });
      T.status = `<span class="bad">Не то.</span> Решено подряд: <b>${T.score}</b>${T.score >= (prog().best.marathon || 0) && T.score ? ' — рекорд' : ''}`;
      T.btns = [['show', 'Решение'], ['restart', 'Ещё раз', true]];
      renderSolve(); return;
    }
    T.status = `<span class="bad">Не то${note ? ' (' + note + ')' : ''}.</span> <span class="sub">Попробуйте ещё</span>`;
    renderSolve();
    later(() => { T.ch.undo(); const h = T.ch.history({ verbose: true }); T.last = lastOf(h[h.length - 1]); T.state = 'ask'; drawBoard(); }, 750);
    return;
  }
  T.step++;
  const solvedNow = T.step >= it.s.length || it.t === 'tac' || it.t === 'fork' || it.t === 'mine';
  if (solvedNow) { puzzleSolved(); return; }
  T.state = 'reply'; T.status = '<span class="ok">Верно</span> <span class="sub">— продолжайте</span>'; renderSolve();
  later(() => { T.last = lastOf(tryMove(T.ch, it.s[T.step++])); T.state = 'ask'; drawBoard(); }, 450);
}
function puzzleSolved() {
  const it = T.it;
  T.state = 'done'; T.done = true;
  saveProg(p => { if (!T.failed) p.solved[it.id] = 1; else if (p.solved[it.id] !== 1) p.solved[it.id] = 0; });
  if (T.marathon) {
    T.score++;
    T.status = `<span class="ok">Верно</span> · решено подряд: <b>${T.score}</b>`;
    renderSolve(); later(() => loadPuzzleItem(T.i + 1), 700); return;
  }
  T.status = T.failed ? '<span class="ok">Решено</span> <span class="sub">со второй попытки</span>' : '<span class="ok">Верно!</span>';
  if (it.t === 'mine') T.status += ` <span class="sub">В партии было ${esc(ru(it.played))}, ${fmtEval(it.after)}</span>`;
  T.btns = [['retry', 'Заново'], ['next', 'Дальше', true]];
  renderSolve();
  // для тактики доигрываем вариант, чтобы было видно, что выигрывается
  if (it.t === 'tac' || it.t === 'fork') {
    let k = T.step;
    const step = () => { if (T.it !== it || k >= it.s.length) return; const m = tryMove(T.ch, it.s[k++]); if (!m) return; T.last = lastOf(m); drawBoard(); later(step, 700); };
    later(step, 600);
  }
}
function puzzleAct(a) {
  const it = T.it;
  if (a === 'back' || a === 'exit') return leaveSolve();
  if (a === 'restart') return startPuzzles(T.title, shuffle(T.items.slice()), { marathon: true });
  if (a === 'next') return loadPuzzleItem(T.i + 1);
  if (a === 'retry') return loadPuzzleItem(T.i);
  if (a === 'hint' && T.state === 'ask') {
    T.failed = true;
    const from = it.s[T.step].slice(0, 2);
    T.marks = [{ sq: from, cls: 'mk-sel' }]; drawBoard();
    return;
  }
  if (a === 'show') {
    T.failed = true; T.state = 'show'; clearT(); T.timers = [];
    const play = () => {
      if (T.it !== it || T.step >= it.s.length) { T.status = '<span class="sub">Решение показано</span>'; T.btns = T.marathon ? [['restart', 'Ещё раз', true]] : [['retry', 'Заново'], ['next', 'Дальше', true]]; renderSolve(); return; }
      const fen = T.ch.fen(); const u = it.s[T.step];
      T.best = u; drawBoard();
      later(() => { if (T.ch.fen() !== fen) return; T.best = null; T.last = lastOf(tryMove(T.ch, u)); T.step++; drawBoard(); later(play, 650); }, 650);
    };
    saveProg(p => { if (p.solved[it.id] !== 1) p.solved[it.id] = 0; });
    play();
  }
}

// --- эндшпиль против движка
function startEndgame(i) {
  const e = ENDGAMES[i];
  enterSolve({ kind: 'endgame', title: e.name, i, e, act: endgameAct, moves: 0, over: false });
  T.ch = new Chess(e.f); T.human = T.ch.turn(); S.orient = T.human;
  T.sub = `${i + 1} из ${ENDGAMES.length}`;
  T.status = `<span class="sub">${esc(e.note)}</span>`;
  T.btns = [['undo', 'Ход назад'], ['restart', 'Заново'], ['next', 'Дальше']];
  if (!playEngine) playEngine = new Engine({ Hash: 16 });
  resetPieces(); drawBoard(); renderSolve();
}
function endgameCanMove() { return T.kind === 'endgame' && !T.over && !T.busy && T.ch.turn() === T.human; }
function endgameFinish(win, text) {
  T.over = true;
  if (win) saveProg(p => { p.eg[T.i] = 1; });
  T.status = `<span class="${win ? 'ok' : 'bad'}">${text}</span>`;
  T.btns = [['restart', 'Заново'], ['next', 'Дальше', true]];
  renderSolve();
}
async function endgameMove(m) {
  const e = T.e, ch = T.ch;
  T.last = lastOf(m); T.moves++; drawBoard();
  if (ch.isCheckmate()) return endgameFinish(true, `Мат за ${T.moves} ${plural(T.moves, ['ход', 'хода', 'ходов'])}`);
  if (ch.isDraw()) return endgameFinish(e.goal === 'hold', e.goal === 'hold' ? 'Ничья — задача решена' : ch.isStalemate() ? 'Пат — это ничья, задача не решена' : 'Ничья — задача не решена');
  if (e.goal === 'hold' && T.moves >= 25) return endgameFinish(true, 'Вы продержались 25 ходов — ничья');
  T.busy = true; T.status = `<span class="sub">Ходов: ${T.moves} · движок думает…</span>`; renderSolve();
  const promotedSq = m.promotion ? m.to : null;
  later(async () => {
    const fen = ch.fen();
    try { await playEngine.ready; } catch { T.busy = false; T.status = '<span class="bad">Движок не запустился</span>'; renderSolve(); return; }
    playEngine.send('setoption name Skill Level value 20');
    const r = await playEngine.analyse(fen, 'movetime 600');
    if (T.kind !== 'endgame' || T.ch !== ch || ch.fen() !== fen) return;
    T.busy = false;
    const reply = r && r.best && tryMove(ch, r.best);
    if (reply) T.last = lastOf(reply);
    drawBoard();
    if (ch.isCheckmate()) return endgameFinish(false, 'Вам поставили мат');
    if (ch.isDraw()) return endgameFinish(e.goal === 'hold', e.goal === 'hold' ? 'Ничья — задача решена' : 'Ничья — задача не решена');
    // движок считает позицию для себя выигранной (или наоборот — для вас уже ничьей)
    const engSide = r && (r.type === 'mate' ? (r.n > 0 ? 99 : -99) : r.n / 100);
    if (e.goal === 'hold' && engSide >= 5) return endgameFinish(false, 'Позиция проиграна');
    if (e.goal !== 'hold' && engSide !== null && engSide > -1.5) return endgameFinish(false, 'Выигрыш упущен');
    if (promotedSq && ch.get(promotedSq) && ch.get(promotedSq).color === T.human) return endgameFinish(true, 'Пешка прошла в ферзи');
    T.status = `<span class="sub">Ходов: ${T.moves}</span>`; renderSolve();
  }, 300);
}
function endgameAct(a) {
  if (a === 'restart') return startEndgame(T.i);
  if (a === 'next') return startEndgame((T.i + 1) % ENDGAMES.length);
  if (a === 'undo' && !T.busy && !T.over && T.ch.history().length) {
    T.ch.undo(); if (T.ch.turn() !== T.human && T.ch.history().length) T.ch.undo();
    T.moves = Math.max(0, T.moves - 1);
    const h = T.ch.history({ verbose: true }); T.last = lastOf(h[h.length - 1]);
    S.sel = null; drawBoard();
  }
}

// --- координаты
const ALL_SQ = Array.from({ length: 64 }, (_, i) => String.fromCharCode(97 + i % 8) + (Math.floor(i / 8) + 1));
function startCoords() {
  enterSolve({ kind: 'coords', title: 'Координаты', act: coordsAct, noCoords: true, running: false });
  S.orient = 'w'; T.sub = 'доску можно перевернуть';
  T.status = 'Нажмите «Старт» и находите названную клетку. 30 секунд.';
  T.btns = [['start', 'Старт', true]];
  resetPieces(); drawBoard(); renderSolve();
}
function coordsAct(a) {
  if (a !== 'start') return;
  Object.assign(T, { running: true, score: 0, miss: 0, end: Date.now() + 30000, target: ALL_SQ[Math.floor(Math.random() * 64)], marks: [] });
  T.btns = [];
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    if (!left) return coordsOver();
    T.status = `<span class="big">${T.target}</span> <span class="sub">${left} с · найдено ${T.score}</span>`; renderSolve();
  };
  tick(); T.timers.push(setInterval(tick, 250));
}
function coordsTap(sq) {
  if (T.kind !== 'coords') return false;
  if (!T.running) return true;
  const ok = sq === T.target;
  if (ok) T.score++; else T.miss++;
  T.marks = [{ sq, cls: ok ? 'mk-ok' : 'mk-bad' }];
  if (!ok) T.marks.push({ sq: T.target, cls: 'mk-miss' });
  drawBoard();
  if (ok) { let n; do n = ALL_SQ[Math.floor(Math.random() * 64)]; while (n === T.target); T.target = n; }
  later(() => { T.marks = []; drawBoard(); }, 280);
  return true;
}
function coordsOver() {
  clearT(); T.timers = []; T.running = false;
  const rec = T.score > (prog().best.coords || 0);
  if (rec) saveProg(p => { p.best.coords = T.score; });
  T.status = `Найдено <b>${T.score}</b>${T.miss ? `, ошибок ${T.miss}` : ''}${rec ? ' — рекорд' : ''}`;
  T.btns = [['start', 'Ещё раз', true]];
  renderSolve();
}

// --- что висит: фигура под боем без защиты или под боем более дешёвой фигуры
function hangingSet(ch) {
  const out = new Set();
  ch.board().forEach((row, i) => row.forEach((p, j) => {
    if (!p || p.type === 'k') return;
    const sq = String.fromCharCode(97 + j) + (8 - i), enemy = p.color === 'w' ? 'b' : 'w';
    const att = ch.attackers(sq, enemy); if (!att.length) return;
    const defended = ch.attackers(sq, p.color).length > 0;
    const cheapest = Math.min(...att.map(a => ({ p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 })[ch.get(a).type]));
    if (!defended || cheapest < ({ p: 1, n: 3, b: 3, r: 5, q: 9 })[p.type]) out.add(sq);
  }));
  return out;
}
function startHanging() {
  // позиции из задач — сразу после хода соперника, как в жизни
  const pool = shuffle(BANK.map(p => { const ch = new Chess(p.f); tryMove(ch, p.s[0]); return ch.fen(); }))
    .filter(f => hangingSet(new Chess(f)).size <= 4);
  enterSolve({ kind: 'hanging', title: 'Что висит?', act: hangingAct, pool, i: -1, streak: 0 });
  nextHanging();
}
function nextHanging() {
  T.i++; T.ch = new Chess(T.pool[T.i % T.pool.length]); T.answer = hangingSet(T.ch); T.picked = new Set(); T.checked = false;
  S.orient = T.ch.turn(); T.marks = []; T.last = null;
  T.sub = `подряд без ошибок: ${T.streak}`;
  T.status = 'Отметьте все фигуры <b>обеих сторон</b>, которые можно взять даром. Если ничего не висит — сразу «Проверить».';
  T.btns = [['check', 'Проверить', true]];
  resetPieces(); drawBoard(); renderSolve();
}
function hangingTap(sq) {
  if (T.kind !== 'hanging') return false;
  if (T.checked || !T.ch.get(sq) || T.ch.get(sq).type === 'k') return true;
  if (T.picked.has(sq)) T.picked.delete(sq); else T.picked.add(sq);
  T.marks = [...T.picked].map(s => ({ sq: s, cls: 'mk-sel' }));
  drawBoard(); return true;
}
function hangingAct(a) {
  if (a === 'next') return nextHanging();
  if (a !== 'check') return;
  T.checked = true;
  const miss = [...T.answer].filter(s => !T.picked.has(s)), extra = [...T.picked].filter(s => !T.answer.has(s));
  T.marks = [...[...T.answer].filter(s => T.picked.has(s)).map(s => ({ sq: s, cls: 'mk-ok' })), ...miss.map(s => ({ sq: s, cls: 'mk-miss' })), ...extra.map(s => ({ sq: s, cls: 'mk-bad' }))];
  const ok = !miss.length && !extra.length;
  T.streak = ok ? T.streak + 1 : 0;
  if (ok && T.streak > (prog().best.hanging || 0)) saveProg(p => { p.best.hanging = T.streak; });
  T.status = ok ? (T.answer.size ? '<span class="ok">Всё верно</span>' : '<span class="ok">Верно — ничего не висит</span>')
    : `<span class="bad">${[miss.length ? `пропущено ${miss.length}` : '', extra.length ? `лишних ${extra.length}` : ''].filter(Boolean).join(', ')}</span> <span class="sub">красная рамка — что висело</span>`;
  T.sub = `подряд без ошибок: ${T.streak}`;
  T.btns = [['next', 'Дальше', true]];
  drawBoard(); renderSolve();
}

// ---------- настройки
function setSeg(id, v) { for (const b of $(id).children) b.classList.toggle('on', b.dataset.v === String(v)); }
setSeg('colorSeg', prefs.color); setSeg('depthSeg', prefs.depth);
$('colorSeg').addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.v; if (!v) return;
  setSeg('colorSeg', v);
  prefs.color = v; store.set(PREF_KEY, { ...store.get(PREF_KEY, {}), color: v });
});
$('depthSeg').addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.v; if (!v) return;
  setSeg('depthSeg', v); prefs.depth = +v; store.set(PREF_KEY, { ...store.get(PREF_KEY, {}), depth: +v });
});
$('goBtn').onclick = () => openGame($('pgn').value);

// ---------- партии с chess.com (публичный API, ключ не нужен)
const CC = { games: [], archives: [], next: -1, shown: 20, loading: false };
const TIME_CLASS = { bullet: 'пуля', blitz: 'блиц', rapid: 'рапид', daily: 'заочные', classical: 'классика' };
const DRAWS = ['agreed', 'repetition', 'stalemate', 'insufficient', '50move', 'timevsinsufficient'];
function ccMsg(text, isErr) { $('ccMsg').textContent = text || ''; $('ccMsg').className = 'msg' + (isErr ? ' err' : ''); }
async function ccJson(url) {
  let r;
  try { r = await fetch(url); } catch { throw new Error('нет связи с chess.com'); }
  if (r.status === 404) throw new Error(`игрок «${nick()}» не найден`);
  if (!r.ok) throw new Error('chess.com ответил ' + r.status);
  return r.json();
}
const slim = g => ({ url: g.url, pgn: g.pgn, end_time: g.end_time, time_class: g.time_class,
  white: { username: g.white.username, rating: g.white.rating, result: g.white.result },
  black: { username: g.black.username, rating: g.black.rating, result: g.black.result } });
async function loadCC(reset = true) {
  if (CC.loading) return;
  const name = nick().toLowerCase();
  if (!name) { ccMsg('Введите ник на chess.com'); return; }
  CC.loading = true;
  if (reset) { CC.archives = []; CC.next = -1; CC.shown = 20; }
  if (!CC.games.length) ccMsg('Загрузка…');
  $('reloadBtn').style.opacity = .4;
  try {
    if (!CC.archives.length) {
      const a = await ccJson(`https://api.chess.com/pub/player/${encodeURIComponent(name)}/games/archives`);
      CC.archives = a.archives || []; CC.next = CC.archives.length - 1;
      CC.games = []; // список месяцев получен заново — собираем партии с нуля
    }
    // месяцы идут от свежих к старым; догружаем, пока не наберём сколько показать
    while (CC.games.length < CC.shown && CC.next >= 0) {
      const m = await ccJson(CC.archives[CC.next--]);
      CC.games.push(...(m.games || []).filter(g => g.rules === 'chess' && g.pgn).sort((a, b) => b.end_time - a.end_time).map(slim));
    }
    store.set(CC_CACHE, { nick: name, games: CC.games.slice(0, 40) });
    ccMsg(CC.games.length ? '' : 'Партий нет');
  } catch (e) {
    const c = store.get(CC_CACHE, null);
    if (reset && c && c.nick === name && !CC.games.length) CC.games = c.games;
    ccMsg(`Не удалось обновить: ${e.message}`, true);
  }
  CC.loading = false;
  $('reloadBtn').style.opacity = '';
  renderCC();
}
function renderCC() {
  const name = nick().toLowerCase();
  const saved = new Map(store.get(STORE_KEY, []).filter(x => x.src).map(x => [x.src, x]));
  const now = new Date();
  $('ccGames').innerHTML = CC.games.slice(0, CC.shown).map((g, i) => {
    const my = g.white.username.toLowerCase() === name ? 'w' : 'b';
    const me = my === 'w' ? g.white : g.black, op = my === 'w' ? g.black : g.white;
    const r = me.result === 'win' ? 'w' : DRAWS.includes(me.result) ? 'd' : 'l';
    const d = new Date(g.end_time * 1000);
    const date = d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    const sv = saved.get(g.url);
    return `<li><button data-i="${i}"><span class="gres ${r}">${RES_LETTER[r]}</span>
      <span class="gmain"><b><i class="cdot ${my}"></i>${esc(op.username)} <span>${op.rating}</span></b><span>${TIME_CLASS[g.time_class] || esc(g.time_class)} · ${esc(date)}</span></span>
      <span class="gside">${sv && sv.ev.every(Boolean) ? '<i class="done" title="Разобрана"></i>' : ''}</span></button></li>`;
  }).join('');
  $('moreBtn').hidden = !(CC.games.length > CC.shown || CC.next >= 0);
}
$('ccGames').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const g = CC.games[+b.dataset.i]; if (!g) return;
  const sv = store.get(STORE_KEY, []).find(x => x.src === g.url);
  openGame(g.pgn, sv ? { saved: sv } : { src: g.url });
});
$('moreBtn').onclick = () => { CC.shown += 20; renderCC(); loadCC(false); };
$('reloadBtn').onclick = () => loadCC();
$('nick').value = nick();
$('nick').addEventListener('change', () => {
  store.set(PREF_KEY, { ...store.get(PREF_KEY, {}), nick: $('nick').value.trim() });
  CC.games = []; renderCC(); loadCC();
});
{
  const c = store.get(CC_CACHE, null);
  if (c && c.nick === nick().toLowerCase()) { CC.games = c.games; renderCC(); }
  loadCC();
}

history.replaceState(null, '');
renderRecent();
window.__appReady = true;

// GitHub Pages разрешает браузеру держать страницу в кэше до 10 минут, а встроенные браузеры приложений — дольше.
// Поэтому при открытии сверяемся со свежей копией и, если версия новее, перезагружаемся на неё (один раз на версию).
const APP_VERSION = '6';
if (location.protocol.startsWith('http')) {
  fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.text() : '')
    .then(t => {
      const m = /const APP_VERSION = '([^']+)'/.exec(t);
      if (!m || m[1] === APP_VERSION) return;
      let tried = null; try { tried = sessionStorage.getItem('pgnReview.updateTried'); } catch {}
      if (tried === m[1]) return;
      try { sessionStorage.setItem('pgnReview.updateTried', m[1]); } catch {}
      location.replace(location.pathname + '?v=' + m[1]);
    })
    .catch(() => {});
}
